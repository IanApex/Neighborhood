name: Deploy worker to Cloudflare

# The worker bundles code from outside worker/ at build time: the src/
# fetch modules are imported directly and prompts/synthesis-prompt.md is
# bundled as text — so changes to any of the three must redeploy.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'src/**'
      - 'prompts/**'
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker
      - run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
